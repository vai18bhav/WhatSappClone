<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings — ChatFlow</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body style="background-color: var(--bg-main);">
  <div style="max-width: 600px; margin: 40px auto; padding: 0 20px;">
    
    <!-- Top Nav Header -->
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:20px;">
      <a href="/chat.html" style="color:var(--secondary); text-decoration:none; font-weight:600; font-size:15px; display:flex; align-items:center; gap:6px;">
        ← Back to Chats
      </a>
      <h2 style="font-size:20px; font-weight:700;">Settings</h2>
      <div style="width:70px;"></div>
    </div>

    <!-- Appearance Section -->
    <div style="background:var(--bg-card); padding:25px; border-radius:var(--radius-md); box-shadow:var(--shadow-sm); margin-bottom:20px;">
      <h3 style="font-size:16px; margin-bottom:15px; color:var(--primary);">Appearance</h3>
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <div>
          <div style="font-weight:600; font-size:14px;">Theme Mode</div>
          <div style="font-size:12px; color:var(--text-muted);">Choose between clean light and modern dark mode</div>
        </div>
        <select id="themeSelect" class="form-control" style="width:130px;">
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </div>
    </div>

    <!-- Privacy Section -->
    <div style="background:var(--bg-card); padding:25px; border-radius:var(--radius-md); box-shadow:var(--shadow-sm); margin-bottom:20px;">
      <h3 style="font-size:16px; margin-bottom:15px; color:var(--primary);">Privacy</h3>
      <form id="privacyForm">
        <div style="margin-bottom:14px; display:flex; justify-content:space-between; align-items:center;">
          <div>
            <div style="font-weight:600; font-size:14px;">Last Seen & Online</div>
            <div style="font-size:12px; color:var(--text-muted);">Who can see when you were last active</div>
          </div>
          <select id="privacyLastSeen" class="form-control" style="width:130px;">
            <option value="everyone">Everyone</option>
            <option value="contacts">Contacts</option>
            <option value="nobody">Nobody</option>
          </select>
        </div>

        <div style="margin-bottom:14px; display:flex; justify-content:space-between; align-items:center;">
          <div>
            <div style="font-weight:600; font-size:14px;">Profile Photo</div>
            <div style="font-size:12px; color:var(--text-muted);">Who can view your profile picture</div>
          </div>
          <select id="privacyProfilePhoto" class="form-control" style="width:130px;">
            <option value="everyone">Everyone</option>
            <option value="contacts">Contacts</option>
            <option value="nobody">Nobody</option>
          </select>
        </div>

        <div style="margin-bottom:18px; display:flex; justify-content:space-between; align-items:center;">
          <div>
            <div style="font-weight:600; font-size:14px;">About / Bio</div>
            <div style="font-size:12px; color:var(--text-muted);">Who can see your status text</div>
          </div>
          <select id="privacyAbout" class="form-control" style="width:130px;">
            <option value="everyone">Everyone</option>
            <option value="contacts">Contacts</option>
            <option value="nobody">Nobody</option>
          </select>
        </div>

        <button type="submit" class="auth-btn-primary" style="margin-top:0;">Save Privacy Settings</button>
      </form>
    </div>

    <!-- Security / Password Section -->
    <div style="background:var(--bg-card); padding:25px; border-radius:var(--radius-md); box-shadow:var(--shadow-sm); margin-bottom:20px;">
      <h3 style="font-size:16px; margin-bottom:15px; color:var(--primary);">Security</h3>
      <form id="passwordForm">
        <div style="margin-bottom:12px;">
          <label class="form-label" for="currentPassword">Current Password</label>
          <input type="password" id="currentPassword" class="form-control" required autocomplete="current-password">
        </div>
        <div style="margin-bottom:12px;">
          <label class="form-label" for="newPassword">New Password</label>
          <input type="password" id="newPassword" class="form-control" required placeholder="Min 8 characters" autocomplete="new-password">
        </div>
        <div style="margin-bottom:16px;">
          <label class="form-label" for="confirmPassword">Confirm New Password</label>
          <input type="password" id="confirmPassword" class="form-control" required autocomplete="new-password">
        </div>
        <button type="submit" class="auth-btn-primary" style="margin-top:0;">Update Password</button>
      </form>
    </div>

  </div>

  <script src="/js/ui.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/settings.js"></script>
</body>
</html>
